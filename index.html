<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Picture Practice</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#1f2937}
.container{max-width:1050px;margin:auto;padding:18px}
header{background:linear-gradient(135deg,#4f46e5,#06b6d4);color:white;border-radius:22px;padding:24px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.12)}
h1{margin:0 0 8px;font-size:30px}
.subtitle{font-size:16px;opacity:.95}
.tabs{display:flex;gap:10px;margin:18px 0}
.tab{flex:1;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700;cursor:pointer;background:#e5e7eb}
.tab.active{background:#4f46e5;color:#fff}
.exercise{background:#fff;border-radius:20px;padding:20px;box-shadow:0 5px 18px rgba(0,0,0,.08)}
.scorebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.score{font-weight:700;font-size:18px}
.progress{font-size:15px;color:#4b5563}
.question{font-size:21px;font-weight:700;text-align:center;margin:10px 0 18px}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{border:3px solid transparent;border-radius:18px;background:#f8fafc;padding:8px;cursor:pointer;transition:.18s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 7px 18px rgba(0,0,0,.12)}
.card img{width:100%;aspect-ratio:1.7/1;object-fit:cover;border-radius:12px;display:block}
.card.correct{border-color:#16a34a;background:#dcfce7}
.card.wrong{border-color:#dc2626;background:#fee2e2}
.card.disabled{pointer-events:none}
.feedback{text-align:center;min-height:46px;margin:15px 0;font-size:18px;font-weight:700}
.next{display:block;margin:0 auto;border:0;border-radius:13px;background:#111827;color:#fff;padding:12px 26px;font-size:16px;font-weight:700;cursor:pointer}
.next:disabled{opacity:.4;cursor:not-allowed}
.hidden{display:none}
.type-wrap{text-align:center}
.big-img{width:min(560px,100%);max-height:330px;object-fit:cover;border-radius:18px;display:block;margin:0 auto 18px;cursor:pointer;box-shadow:0 5px 18px rgba(0,0,0,.12)}
input{width:min(560px,100%);padding:15px;border:2px solid #cbd5e1;border-radius:13px;font-size:20px;text-align:center;outline:none}
input:focus{border-color:#4f46e5}
.type-buttons{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
button.action{border:0;border-radius:12px;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer}
.check{background:#4f46e5;color:white}.skip{background:#e5e7eb;color:#111827}
.note{font-size:14px;color:#6b7280;text-align:center;margin-top:10px}
.result{text-align:center;padding:25px;background:#f8fafc;border-radius:16px}
.result h2{margin-top:0}
.restart{border:0;background:#059669;color:white;border-radius:12px;padding:12px 22px;font-weight:700;cursor:pointer}
@media(max-width:700px){
 .container{padding:10px}.options{grid-template-columns:1fr}.tabs{flex-direction:column}
 h1{font-size:25px}.exercise{padding:14px}
}
</style>
</head>
<body>
<div class="container">
<header>
<h1>Vocabulary Picture Practice</h1>
<div class="subtitle">Listen • Choose • Type • Learn</div>
</header>

<div class="tabs">
<button class="tab active" id="tab1" onclick="showExercise(1)">Exercise 1: Choose the Picture</button>
<button class="tab" id="tab2" onclick="showExercise(2)">Exercise 2: Type the Word</button>
</div>

<section id="ex1" class="exercise">
<div class="scorebar">
<div class="score" id="score1">Score: 0 / 17</div>
<div class="progress" id="progress1">Question 1 of 17</div>
</div>
<div class="question">Which picture shows <span id="targetHint">the word</span>?</div>
<div class="options" id="options"></div>
<div class="feedback" id="feedback1"></div>
<button class="next" id="next1" disabled onclick="nextEx1()">Next</button>
</section>

<section id="ex2" class="exercise hidden">
<div class="scorebar">
<div class="score" id="score2">Score: 0 / 17</div>
<div class="progress" id="progress2">Word 1 of 17</div>
</div>
<div class="question">Look at the picture and type the word.</div>
<div class="type-wrap">
<img id="typeImage" class="big-img" alt="Vocabulary picture" onclick="speakCurrent()">
<input id="answerInput" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type the word here">
<div class="type-buttons">
<button class="action check" onclick="checkType()">Check</button>
<button class="action skip" onclick="skipType()">Skip</button>
</div>
<div class="feedback" id="feedback2"></div>
<div class="note">Click the picture to hear the pronunciation.</div>
<button class="next" id="next2" disabled onclick="nextEx2()">Next</button>
</div>
</section>
</div>

let ex1Index=0, ex1Score=0, ex1Answered=false;
let ex2Index=0, ex2Score=0, ex2Answered=false;

function speak(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB';
  u.rate=0.82;
  u.pitch=1;
  window.speechSynthesis.speak(u);
}

function shuffled(arr){
  return [...arr].sort(()=>Math.random()-0.5);
}

function showExercise(n){
  document.getElementById('ex1').classList.toggle('hidden',n!==1);
  document.getElementById('ex2').classList.toggle('hidden',n!==2);
  document.getElementById('tab1').classList.toggle('active',n===1);
  document.getElementById('tab2').classList.toggle('active',n===2);
  if(n===1 && ex1Index===0 && !ex1Answered) renderEx1();
  if(n===2 && ex2Index===0 && !ex2Answered) renderEx2();
}

function renderEx1(){
  ex1Answered=false;
  document.getElementById('feedback1').textContent='';
  document.getElementById('next1').disabled=true;
  document.getElementById('progress1').textContent=`Question ${ex1Index+1} of ${vocab.length}`;
  document.getElementById('score1').textContent=`Score: ${ex1Score} / ${vocab.length}`;

  const target=vocab[ex1Index];
  document.getElementById('targetHint').textContent=target.word;

  let others=vocab.filter((_,i)=>i!==ex1Index);
  let choices=shuffled([target,...shuffled(others).slice(0,2)]);
  const box=document.getElementById('options');
  box.innerHTML='';

  choices.forEach(item=>{
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`<img src="${item.img}" alt="Picture">`;
    card.onclick=()=>answerEx1(card,item.word===target.word,item.word);
    card.onmouseenter=()=>{};
    card.addEventListener('click',()=>speak(item.word),{once:false});
    box.appendChild(card);
  });
}

function answerEx1(card,isCorrect,word){
  if(ex1Answered) return;
  ex1Answered=true;
  document.querySelectorAll('#options .card').forEach(c=>c.classList.add('disabled'));
  if(isCorrect){
    card.classList.add('correct');
    ex1Score++;
    document.getElementById('feedback1').textContent='✓ Correct!';
    document.getElementById('feedback1').style.color='#15803d';
  }else{
    card.classList.add('wrong');
    const correctIndex=ex1Index;
    document.querySelectorAll('#options .card').forEach(c=>{
      const img=c.querySelector('img').src;
      if(img===vocab[correctIndex].img) c.classList.add('correct');
    });
    document.getElementById('feedback1').textContent='✗ Incorrect. The correct picture is highlighted.';
    document.getElementById('feedback1').style.color='#b91c1c';
  }
  document.getElementById('score1').textContent=`Score: ${ex1Score} / ${vocab.length}`;
  document.getElementById('next1').disabled=false;
}

function nextEx1(){
  ex1Index++;
  if(ex1Index>=vocab.length){
    showResult(1);
    return;
  }
  renderEx1();
}

function renderEx2(){
  ex2Answered=false;
  document.getElementById('feedback2').textContent='';
  document.getElementById('next2').disabled=true;
  document.getElementById('progress2').textContent=`Word ${ex2Index+1} of ${vocab.length}`;
  document.getElementById('score2').textContent=`Score: ${ex2Score} / ${vocab.length}`;
  document.getElementById('typeImage').src=vocab[ex2Index].img;
  document.getElementById('answerInput').value='';
  document.getElementById('answerInput').disabled=false;
  document.querySelector('#ex2 .check').disabled=false;
  document.getElementById('answerInput').focus();
}

function speakCurrent(){ speak(vocab[ex2Index].word); }

function normalize(s){return s.trim().toLowerCase().replace(/\s+/g,' ');}

function checkType(){
  if(ex2Answered) return;
  const input=document.getElementById('answerInput').value;
  if(!input.trim()) return;
  const correct=normalize(input)===normalize(vocab[ex2Index].word);
  if(correct){
    ex2Answered=true;
    ex2Score++;
    document.getElementById('feedback2').textContent='✓ Correct! Click Next to continue.';
    document.getElementById('feedback2').style.color='#15803d';
    document.getElementById('next2').disabled=false;
    document.getElementById('answerInput').disabled=true;
    document.querySelector('#ex2 .check').disabled=true;
  }else{
    document.getElementById('feedback2').textContent='✗ Incorrect. Try again or click Skip.';
    document.getElementById('feedback2').style.color='#b91c1c';
    document.getElementById('answerInput').select();
  }
  document.getElementById('score2').textContent=`Score: ${ex2Score} / ${vocab.length}`;
}

function skipType(){
  if(ex2Answered) return;
  ex2Answered=true;
  document.getElementById('feedback2').textContent='Skipped. Click Next to continue.';
  document.getElementById('feedback2').style.color='#6b7280';
  document.getElementById('next2').disabled=false;
  document.getElementById('answerInput').disabled=true;
  document.querySelector('#ex2 .check').disabled=true;
}

function nextEx2(){
  ex2Index++;
  if(ex2Index>=vocab.length){
    showResult(2);
    return;
  }
  renderEx2();
}

function showResult(n){
  const section=document.getElementById(n===1?'ex1':'ex2');
  const score=n===1?ex1Score:ex2Score;
  section.innerHTML=`
    <div class="result">
      <h2>Exercise ${n} Complete!</h2>
      <p style="font-size:24px;font-weight:700">Your score: ${score} / ${vocab.length}</p>
      <p>Great job! You can practise again to improve your score.</p>
      <button class="restart" onclick="location.reload()">Practise Again</button>
    </div>`;
}

document.getElementById('answerInput').addEventListener('keydown',e=>{
  if(e.key==='Enter' && !ex2Answered) checkType();
});
renderEx1();
</script>
